<div>Generation: {{ generation$ | ngrxPush }}</div>
@for (column of activeGame$ | ngrxPush; track trackLifeRow($index, column)) {
    <div>
        <div style="display: flex">
            @for (item of column; track trackLife($index, item)) {
                <div class="cell">
                    <div [load]="item.component | ngrxPush" rxDynamic></div>
                </div>
            }
        </div>
    </div>
}
